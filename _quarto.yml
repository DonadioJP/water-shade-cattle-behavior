project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll

website:
  title: "Water & Shade for Cattle — Experimental Study"
  favicon: assets/favicon.ico
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: methods.qmd
        text: Methods
      - text: Results
        menu:
          - href: results-thermal.qmd
            text: Thermal Comfort
          - href: results-behavior.qmd
            text: Behavior
      - href: findings.qmd
        text: Key Findings
      - href: about.qmd
        text: About
      - href: manuscript/Prettoetal_paper.qmd
        text: Manuscript
    right:
      - icon: github
        href: https://github.com/DonadioJP/water-shade-cattle-behavior
  page-footer:
    left: "Pretto et al. - LETA/UFSC"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    include-in-header:
      text: |
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    fig-align: center
    fig-width: 9
    fig-height: 5.5

execute:
  echo: false
  warning: false
  message: false
  cache: true
